spring:
  application:
    name: kaizen-invoice
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/invoice}
    username: ${DATABASE_USER:invoice}
    password: ${DATABASE_PASSWORD}
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8187}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        secure: ${SECURE_COOKIES:false}
        same-site: lax
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${AWS_REGION:ap-south-1}
    bucket: ${S3_BUCKET:invoices}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
  extraction:
    endpoint: ${AZURE_DOCUMENT_ENDPOINT:}
    key: ${AZURE_DOCUMENT_KEY:}
    model: ${AZURE_DOCUMENT_MODEL:prebuilt-invoice}
  email:
    signing-key: ${MAILGUN_SIGNING_KEY:}
    domain: ${INTAKE_DOMAIN:}
  scanner:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    enabled: ${MALWARE_SCAN_ENABLED:true}
  worker:
    enabled: ${WORKER_ENABLED:true}
